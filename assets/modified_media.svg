<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#1e1a12"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Simulated press conference scene with editing artifacts -->
  <rect x="200" y="280" width="120" height="170" rx="4" fill="#2a2530" opacity="0.8"/>
  <rect x="220" y="260" width="80" height="20" rx="10" fill="#3a3540"/>
  <!-- Podium -->
  <rect x="300" y="200" width="200" height="250" rx="6" fill="#352f28"/>
  <rect x="320" y="180" width="160" height="20" rx="3" fill="#4a4038"/>
  <!-- Microphones -->
  <line x1="370" y1="140" x2="370" y2="200" stroke="#666" stroke-width="2"/>
  <circle cx="370" cy="135" r="6" fill="#555"/>
  <line x1="430" y1="145" x2="430" y2="200" stroke="#666" stroke-width="2"/>
  <circle cx="430" cy="140" r="6" fill="#555"/>
  <!-- Manipulation indicator: colored region overlay -->
  <rect x="340" y="120" width="120" height="100" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  <text x="400" y="240" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600" opacity="0.9">⚠ REGION MODIFIED</text>
  <!-- ELA anomaly visualization -->
  <rect x="350" y="130" width="100" height="80" fill="#f59e0b" opacity="0.08"/>
  <!-- Audience silhouettes -->
  <ellipse cx="150" cy="380" rx="30" ry="40" fill="#252025"/>
  <ellipse cx="150" cy="340" rx="15" ry="15" fill="#2a252a"/>
  <ellipse cx="650" cy="380" rx="30" ry="40" fill="#252025"/>
  <ellipse cx="650" cy="340" rx="15" ry="15" fill="#2a252a"/>
  <ellipse cx="550" cy="390" rx="30" ry="40" fill="#252025"/>
  <ellipse cx="550" cy="350" rx="15" ry="15" fill="#2a252a"/>
  <!-- Warning badge -->
  <rect x="20" y="20" width="180" height="32" rx="16" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="110" y="41" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="600">⚠ Content Altered</text>
</svg>
