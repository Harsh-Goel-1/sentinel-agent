<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Grainy, low-res feel conference scene -->
  <rect x="280" y="180" width="240" height="270" rx="6" fill="#222228"/>
  <rect x="300" y="160" width="200" height="20" rx="3" fill="#2a2a30"/>
  <!-- Podium details -->
  <rect x="350" y="220" width="100" height="8" rx="2" fill="#333338"/>
  <!-- Microphones -->
  <line x1="370" y1="120" x2="370" y2="180" stroke="#555" stroke-width="2"/>
  <circle cx="370" cy="115" r="5" fill="#444"/>
  <line x1="430" y1="125" x2="430" y2="180" stroke="#555" stroke-width="2"/>
  <circle cx="430" cy="120" r="5" fill="#444"/>
  <!-- Audience shadows -->
  <ellipse cx="140" cy="380" rx="35" ry="45" fill="#1e1e22"/>
  <ellipse cx="140" cy="335" rx="16" ry="16" fill="#222226"/>
  <ellipse cx="660" cy="380" rx="35" ry="45" fill="#1e1e22"/>
  <ellipse cx="660" cy="335" rx="16" ry="16" fill="#222226"/>
  <ellipse cx="520" cy="390" rx="30" ry="40" fill="#1e1e22"/>
  <ellipse cx="520" cy="350" rx="14" ry="14" fill="#222226"/>
  <!-- "No provenance" indicator -->
  <rect x="20" y="20" width="200" height="32" rx="16" fill="rgba(161,161,170,0.1)" stroke="rgba(161,161,170,0.2)" stroke-width="1"/>
  <text x="120" y="41" text-anchor="middle" fill="#a1a1aa" font-family="sans-serif" font-size="12" font-weight="600">? No Provenance Data</text>
  <!-- Question marks scattered -->
  <text x="600" y="80" fill="#333" font-family="sans-serif" font-size="48" opacity="0.3">?</text>
  <text x="700" y="200" fill="#333" font-family="sans-serif" font-size="36" opacity="0.2">?</text>
  <text x="100" y="250" fill="#333" font-family="sans-serif" font-size="40" opacity="0.25">?</text>
</svg>
